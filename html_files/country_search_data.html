
  Country:
  <input list='search_input_countries' id='datalist_input_element_countries' 
    onkeypress=
    "
      (function (event)
      {
        if (event.keyCode == 13)
        {
          
          var input = document.getElementById('datalist_input_element_countries');
          var options = Array.from(document.getElementById('search_input_countries').options).map(function(el)
          {
            return el.value;
          }); 
          var relevantOptions = options.filter
          (
            function(option)
            {
              return option.toLowerCase().includes(input.value.toLowerCase());
            }
          );

          if (relevantOptions.length == 1 && relevantOptions[0] === input.value)
          {
            var pname = document.getElementById('datalist_input_element_countries').value;
            var pid   = document.querySelector('#search_input_countries option[value=&quot;'+pname+'&quot;]').dataset.value;

            if (pid)
            {
              window.location.href = '/aardvark/html/rankings/' + pid + '.html';
            }
          }
          else if (relevantOptions.length > 0)
          {
            input.value = relevantOptions.shift();
          }
          else
          {
            alert('Choose an option by typing in the box and selecting an option from the pop-up menu.');
          }

        }
      })(event)
    "
